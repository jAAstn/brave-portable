# Portapps
core.dir = ../portapps

# App
app = brave-nightly
app.name = Brave Nightly
app.type = archive
app.version = 1.99.2
app.release = 1
app.homepage = https://brave.com/download-nightly

# Update instructions:
# - fix res/appcast.xml with https://updates.bravesoftware.com/sparkle/Brave-Browser/nightly/appcast.xml

# Portable app
papp.id = ${app}-portable
papp.guid = {A2C4B910-FB9E-4AD1-BE5C-140CC9878D49}
papp.name = ${app.name} Portable
papp.desc = ${app.name} portable on Windows by Portapps
papp.url = https://github.com/jAAstn/brave-portable
papp.folder = app

# Official artifacts
# Nightly is only published as a GitHub release, there is no rolling "latest" URL.
# The release tag matches the appcast version (v<app.version>).
atf.id = Brave Nightly
atf.win64.filename = brave-v${app.version}-win32-x64
atf.win64.ext = .zip
atf.win64.url = https://github.com/brave/brave-browser/releases/download/v${app.version}/brave-v${app.version}-win32-x64.zip
atf.win64.assertextract = brave.exe
